name: Install isolated benchmark source
description: Install the selected immutable source and optional checker tools with measured setup.
inputs:
  ref:
    required: false
    default: ''
  label:
    required: false
    default: ''
  node:
    required: false
    default: 26.12.1
  npm:
    required: false
    default: ''
  ignore-scripts:
    required: false
    default: 'false'
  tools:
    required: false
    default: 'false'
  cache:
    required: false
    default: 'true'
runs:
  using: composite
  steps:
  - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    with:
      ref: ${{ inputs.ref }}
      path: source
      persist-credentials: false
  - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
    with:
      node-version: ${{ inputs.node }}
      cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
      cache-dependency-path: ${{ inputs.tools == 'true' && 'source/scripts/ci-tools/package-lock.json' || 'source/package-lock.json'
        }}
      package-manager-cache: false
      registry-url: ${{ inputs.node == '24' && 'https://registry.npmjs.org' || '' }}
      scope: ${{ inputs.node == '24' && '@codex-app-sdk' || '' }}
  - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    with:
      python-version: '3.12'
  - run: npm install --global "npm@${{ inputs.npm }}"
    if: ${{ inputs.npm != '' }}
    shell: bash
  - run: python ../harness/scripts/ci-benchmark.py run --label "${{ inputs.label }}-install" --output benchmark-results --
      npm ci --no-audit --no-fund ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
    shell: bash
    working-directory: source
  - run: python ../harness/scripts/ci-benchmark.py run --label "${{ inputs.label }}-tools" --output benchmark-results -- npm
      ci --prefix scripts/ci-tools --no-audit --no-fund
    if: ${{ inputs.tools == 'true' }}
    shell: bash
    working-directory: source
  - run: node node_modules/electron/install.js
    if: ${{ inputs.ignore-scripts == 'false' }}
    shell: bash
    working-directory: source
