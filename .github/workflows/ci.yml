name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK packages and compatibility facade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install schema-compatible Codex app-server
        run: npm install --global @openai/codex@0.167.0

      - name: Check SDK packages and compatibility facade
        run: npm run check:sdk

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build documentation
        run: npm run build:docs

  workspaces:
    name: Scaffolder and samples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium and WebKit for browser regressions
        run: npx playwright install --with-deps chromium webkit

      - name: Check scaffolder and samples
        run: npm run check:workspaces

  cli-compatibility:
    name: Codex CLI ${{ matrix.codex }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codex: ['0.164.0', '0.165.0', '0.166.0', '0.167.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install selected Codex CLI
        run: npm install --global @openai/codex@${{ matrix.codex }}
      - name: Build runtime packages
        run: npm run build -w @codex-app-sdk/core && npm run build -w @codex-app-sdk/backend
      - name: Check isolated SDK connection
        run: npm run check:cli-compatibility
