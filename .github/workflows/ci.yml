name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check generated RPC inventory
        run: npm run rpc:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Test
        run: npm test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build documentation
        run: npm run docs:build

  workspaces:
    name: Scaffolder and samples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build SDK dependency
        run: npm run build

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Test workspaces
        run: npm run test --workspaces --if-present

      - name: Build workspaces
        run: npm run build --workspaces --if-present
