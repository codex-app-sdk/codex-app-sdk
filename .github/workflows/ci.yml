name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK packages and compatibility facade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check generated RPC inventory
        run: npm run rpc:check

      - name: Check core package
        run: npm run check -w @codex-app-sdk/core

      - name: Check backend package
        run: npm run check -w @codex-app-sdk/backend

      - name: Check Vue package
        run: npm run check -w @codex-app-sdk/vue

      - name: Check Electron package
        run: npm run check -w @codex-app-sdk/electron

      - name: Check web package
        run: npm run check -w @codex-app-sdk/web

      - name: Check compatibility facade
        run: npm run lint:compat && npm run test:compat && npm run build:compat

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build documentation
        run: npm run docs:build

  workspaces:
    name: Scaffolder and samples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build SDK dependency
        run: npm run build

      - name: Check scaffolder
        run: npm run create:app:test

      - name: Check component lab
        run: npm run lab:typecheck && npm run lab:test && npm run lab:build

      - name: Check Electron samples
        run: npm run sample:typecheck && npm run sample:test && npm run sample:build && npm run spark:typecheck && npm run spark:test && npm run spark:build && npm run relay:typecheck && npm run relay:test && npm run relay:build

      - name: Check web sample
        run: npm run web-sample:typecheck && npm run web-sample:build
