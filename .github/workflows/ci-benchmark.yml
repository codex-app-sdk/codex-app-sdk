name: SDK CI benchmark
run-name: SDK CI benchmark ${{ inputs.variant || 'compare' }} ${{ github.sha }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options:
        - compare
        - baseline
        - optimized
        default: compare
        required: true
        description: Baseline or optimized pipeline
      baseline_ref:
        type: string
        default: 3ab27dd62aff9980e76f6cedd89e827e63e3253e
        required: true
        description: Frozen baseline commit SHA
  push:
    branches:
    - ci/optimization-benchmark
permissions:
  contents: read
concurrency:
  group: ci-optimization-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ inputs.baseline_ref || '3ab27dd62aff9980e76f6cedd89e827e63e3253e' }}
        label: baseline-sdk
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'false'
    - name: Install schema-compatible Codex
      run: npm install --global @openai/codex@0.164.0
    - run: python ../harness/scripts/ci-benchmark.py run --label baseline-sdk --output benchmark-results -- npm run check:sdk
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: baseline-sdk
        path: 'source/benchmark-results/

          source/packages/*/coverage/

          source/packages/*/dist/

          source/dist/'
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'baseline') }}
  baseline-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ inputs.baseline_ref || '3ab27dd62aff9980e76f6cedd89e827e63e3253e' }}
        label: baseline-docs
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'false'
    - run: python ../harness/scripts/ci-benchmark.py run --label baseline-docs --output benchmark-results -- npm run build:docs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: baseline-docs
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'baseline') }}
  baseline-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ inputs.baseline_ref || '3ab27dd62aff9980e76f6cedd89e827e63e3253e' }}
        label: baseline-samples
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'false'
    - run: python ../harness/scripts/ci-benchmark.py run --label baseline-browsers --output benchmark-results -- npx playwright
        install --with-deps chromium webkit
    - run: python ../harness/scripts/ci-benchmark.py run --label baseline-samples --output benchmark-results -- npm run check:workspaces
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: baseline-samples
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'baseline') }}
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-build
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'false'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-build --output benchmark-results -- npm run build:sdk
    - name: Archive exact SDK build outputs with native executable modes
      run: 'python - <<''PYMETA''

        import pathlib,subprocess,hashlib,json

        p=pathlib.Path(''benchmark-results/sdk-build.json'')

        p.write_text(json.dumps({''sha'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''lockfile_sha256'':hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest()}))

        PYMETA

        tar -cf benchmark-results/sdk-build.tar dist packages/core/dist packages/backend/dist packages/vue/dist packages/electron/dist
        packages/web/dist benchmark-results/sdk-build.json'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verified-sdk-build
        path: source/benchmark-results/sdk-build.tar
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-build
        path: 'source/benchmark-results/

          !source/benchmark-results/sdk-build.tar'
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-package-${{ matrix.package }}
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'true'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: verified-sdk-build
        path: ${{ runner.temp }}/sdk-build
    - name: Restore and verify the same-SHA SDK build
      run: 'tar -xf "$RUNNER_TEMP/sdk-build/sdk-build.tar" -C .

        python - <<''PYMETA''

        import pathlib,subprocess,hashlib,json

        manifest=json.loads(pathlib.Path(''benchmark-results/sdk-build.json'').read_text())

        if manifest[''sha'']!=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(): raise SystemExit(''SDK
        artifact source SHA mismatch'')

        if manifest[''lockfile_sha256'']!=hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest(): raise
        SystemExit(''SDK artifact lockfile mismatch'')

        PYMETA'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-package-${{ matrix.package }} --output benchmark-results
        -- bash -eo pipefail -c 'npm run lint --workspace @codex-app-sdk/${{ matrix.package }} && npm run test:coverage --workspace
        @codex-app-sdk/${{ matrix.package }}'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-package-${{ matrix.package }}
        path: 'source/benchmark-results/

          source/packages/${{ matrix.package }}/coverage/'
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    needs:
    - build
    strategy:
      fail-fast: false
      matrix:
        package:
        - core
        - backend
        - vue
        - electron
        - web
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-sample-${{ matrix.package }}
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'true'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: verified-sdk-build
        path: ${{ runner.temp }}/sdk-build
    - name: Restore and verify the same-SHA SDK build
      run: 'tar -xf "$RUNNER_TEMP/sdk-build/sdk-build.tar" -C .

        python - <<''PYMETA''

        import pathlib,subprocess,hashlib,json

        manifest=json.loads(pathlib.Path(''benchmark-results/sdk-build.json'').read_text())

        if manifest[''sha'']!=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(): raise SystemExit(''SDK
        artifact source SHA mismatch'')

        if manifest[''lockfile_sha256'']!=hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest(): raise
        SystemExit(''SDK artifact lockfile mismatch'')

        PYMETA'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-sample-${{ matrix.package }} --output benchmark-results
        -- npm run check --workspace @codex-app-sdk/${{ matrix.package }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-sample-${{ matrix.package }}
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    needs:
    - build
    strategy:
      fail-fast: false
      matrix:
        package:
        - create-codex-app
        - basic-sample
        - spark-sample
        - relay-sample
        - basic-web-sample
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-lab
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'true'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: verified-sdk-build
        path: ${{ runner.temp }}/sdk-build
    - name: Restore and verify the same-SHA SDK build
      run: 'tar -xf "$RUNNER_TEMP/sdk-build/sdk-build.tar" -C .

        python - <<''PYMETA''

        import pathlib,subprocess,hashlib,json

        manifest=json.loads(pathlib.Path(''benchmark-results/sdk-build.json'').read_text())

        if manifest[''sha'']!=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(): raise SystemExit(''SDK
        artifact source SHA mismatch'')

        if manifest[''lockfile_sha256'']!=hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest(): raise
        SystemExit(''SDK artifact lockfile mismatch'')

        PYMETA'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-lab --output benchmark-results -- npm run check
        --workspace @codex-app-sdk/component-lab
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-lab
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    needs:
    - build
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-contracts
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'true'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: verified-sdk-build
        path: ${{ runner.temp }}/sdk-build
    - name: Restore and verify the same-SHA SDK build
      run: 'tar -xf "$RUNNER_TEMP/sdk-build/sdk-build.tar" -C .

        python - <<''PYMETA''

        import pathlib,subprocess,hashlib,json

        manifest=json.loads(pathlib.Path(''benchmark-results/sdk-build.json'').read_text())

        if manifest[''sha'']!=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(): raise SystemExit(''SDK
        artifact source SHA mismatch'')

        if manifest[''lockfile_sha256'']!=hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest(): raise
        SystemExit(''SDK artifact lockfile mismatch'')

        PYMETA'
    - name: Install schema-compatible Codex
      run: npm install --global @openai/codex@0.164.0
    - name: Exercise benchmark harness failure boundaries
      run: python ../harness/scripts/ci-benchmark.py run --label optimized-harness-tests --output benchmark-results -- node
        --test scripts/ci-benchmark.test.mjs
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-contracts --output benchmark-results -- bash -eo
        pipefail -c 'npm run check:schema && npm run check:rpc && npm run check:release && npm run lint:compat && for package
        in core backend vue electron web create-codex-app; do npm pack --dry-run --json --workspace "@codex-app-sdk/$package";
        done'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-contracts
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    needs:
    - build
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-docs
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'false'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-docs --output benchmark-results -- npm run build:docs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-docs
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-parity
        node: '22'
        npm: ''
        ignore-scripts: 'true'
        tools: 'true'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: verified-sdk-build
        path: ${{ runner.temp }}/sdk-build
    - name: Restore and verify the same-SHA SDK build
      run: 'tar -xf "$RUNNER_TEMP/sdk-build/sdk-build.tar" -C .

        python - <<''PYMETA''

        import pathlib,subprocess,hashlib,json

        manifest=json.loads(pathlib.Path(''benchmark-results/sdk-build.json'').read_text())

        if manifest[''sha'']!=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(): raise SystemExit(''SDK
        artifact source SHA mismatch'')

        if manifest[''lockfile_sha256'']!=hashlib.sha256(pathlib.Path(''package-lock.json'').read_bytes()).hexdigest(): raise
        SystemExit(''SDK artifact lockfile mismatch'')

        PYMETA'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-parity --output benchmark-results -- python scripts/ci-parity.py
        --repo sdk --output benchmark-results/parity
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-parity
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    needs:
    - build
  baseline-ci-result:
    if: ${{ always() && (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'baseline') }}
    needs:
    - baseline-sdk
    - baseline-docs
    - baseline-samples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: baseline-*
        path: results
    - name: Require every expected successful result
      env:
        CI_BENCH_NEEDS: ${{ toJSON(needs) }}
      run: python harness/scripts/ci-benchmark.py aggregate --input results --expect baseline-sdk --expect baseline-docs --expect
        baseline-samples
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: baseline-ci-summary
        path: results/summary.json
        if-no-files-found: error
  optimized-result:
    if: ${{ always() && (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    needs:
    - build
    - packages
    - samples
    - lab
    - contracts
    - docs
    - parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: optimized-*
        path: results
    - name: Require every expected successful result
      env:
        CI_BENCH_NEEDS: ${{ toJSON(needs) }}
      run: python harness/scripts/ci-benchmark.py aggregate --input results --expect optimized-build --expect optimized-lab
        --expect optimized-contracts --expect optimized-docs --expect optimized-parity --expect optimized-package-core --expect
        optimized-package-backend --expect optimized-package-vue --expect optimized-package-electron --expect optimized-package-web
        --expect optimized-sample-create-codex-app --expect optimized-sample-basic-sample --expect optimized-sample-spark-sample
        --expect optimized-sample-relay-sample --expect optimized-sample-basic-web-sample --expect optimized-harness-tests
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-sdk-summary
        path: results/summary.json
        if-no-files-found: error
  comparison:
    if: ${{ always() && (github.event_name == 'push' || inputs.variant == 'compare') }}
    needs:
    - baseline-ci-result
    - optimized-result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: baseline-*
        path: results
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: optimized-*
        path: results
    - name: Require identical product test counts and coverage file sets
      env:
        CI_BENCH_NEEDS: ${{ toJSON(needs) }}
      run: python harness/scripts/ci-benchmark.py compare --input results
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: benchmark-comparison
        path: results/comparison.json
        if-no-files-found: error
        retention-days: 14
