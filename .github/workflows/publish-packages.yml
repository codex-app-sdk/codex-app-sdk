name: Publish public packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable SDK version already committed on main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SDK packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@codex-app-sdk'

      - name: Confirm release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION ?? '')
            || process.env.RELEASE_VERSION !== version) {
            throw new Error(`Requested version must match the committed stable SDK version: ${version}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install schema-compatible Codex app-server
        run: npm install --global @openai/codex@0.154.0

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify packages
        run: npm run check

      - name: Preview package contents
        run: |
          for package in core backend vue electron web create-codex-app; do
            npm pack --dry-run --json --workspace "@codex-app-sdk/$package"
          done

      - name: Publish packages
        run: npm run publish:packages

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the published commit and create release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "$RELEASE_SHA" \
            --title "SDK ${RELEASE_VERSION}" \
            --generate-notes
