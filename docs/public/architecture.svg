<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Codex App SDK modular architecture</title>
  <desc id="description">A trusted Node host owns the backend and Codex app-server. Electron IPC or an authorized WebSocket projects the same core surface contracts to a Vue renderer.</desc>
  <style>
    .panel { fill: #f6fbfa; stroke: #b9dcd4; stroke-width: 2; }
    .card { fill: #ffffff; stroke: #c7d7d3; stroke-width: 2; }
    .accent { fill: #e2f7f1; stroke: #58b9a5; stroke-width: 2; }
    .external { fill: #eef3ff; stroke: #7d9fdf; stroke-width: 2; }
    .label { fill: #12231f; font: 600 17px ui-sans-serif, system-ui, sans-serif; }
    .small { fill: #4d625c; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
    .group { fill: #087f6a; font: 700 15px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
    .line { fill: none; stroke: #3c8f7e; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; marker-end: url(#arrow); }
    .line-blue { fill: none; stroke: #587bc4; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; marker-end: url(#arrow-blue); }
    .line-dashed { fill: none; stroke: #3c8f7e; stroke-dasharray: 7 7; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #121b1a; stroke: #315f55; }
      .card { fill: #1a2422; stroke: #3b5550; }
      .accent { fill: #123c34; stroke: #41b79d; }
      .external { fill: #18243d; stroke: #6486ce; }
      .label { fill: #eefcf8; }
      .small { fill: #adc7c0; }
      .group { fill: #62ddc1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3c8f7e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#587bc4"/>
    </marker>
  </defs>

  <rect class="panel" x="28" y="34" width="510" height="552" rx="28"/>
  <text class="group" x="60" y="74">TRUSTED NODE HOST</text>

  <rect class="card" x="60" y="102" width="196" height="82" rx="16"/>
  <text class="label" x="82" y="135">Product host</text>
  <text class="small" x="82" y="160">Auth · policy · services</text>

  <rect class="accent" x="294" y="102" width="212" height="82" rx="16"/>
  <text class="label" x="316" y="135">Backend + Surface</text>
  <text class="small" x="316" y="160">Threads · state · events</text>

  <rect class="card" x="60" y="222" width="196" height="82" rx="16"/>
  <text class="label" x="82" y="255">Extensions</text>
  <text class="small" x="82" y="280">Context · tools · MCP</text>

  <rect class="card" x="294" y="222" width="212" height="82" rx="16"/>
  <text class="label" x="316" y="255">App-server transport</text>
  <text class="small" x="316" y="280">Process · JSONL · socket</text>

  <text class="group" x="60" y="338">HOST ADAPTERS</text>

  <rect class="accent" x="60" y="380" width="196" height="90" rx="16"/>
  <text class="label" x="82" y="414">Electron</text>
  <text class="small" x="82" y="439">IPC · preload · native</text>
  <text class="small" x="82" y="458">attachment registry</text>

  <rect class="accent" x="294" y="380" width="212" height="90" rx="16"/>
  <text class="label" x="316" y="414">Web</text>
  <text class="small" x="316" y="439">Authorized socket lease</text>
  <text class="small" x="316" y="458">framing · reconnect</text>

  <rect class="card" x="60" y="504" width="446" height="52" rx="14"/>
  <text class="label" x="82" y="536">Core · renderer-safe contracts and validation</text>

  <path class="line" d="M256 143H290"/>
  <path class="line" d="M256 263H290"/>
  <path class="line" d="M400 188V218"/>
  <path class="line" d="M400 308V360H158V376"/>
  <path class="line" d="M400 360V376"/>
  <path class="line-dashed" d="M158 474V500M400 474V500"/>

  <rect class="external" x="574" y="102" width="238" height="96" rx="20"/>
  <text class="label" x="598" y="140">Codex app-server</text>
  <text class="small" x="598" y="166">Models · threads · auth · tools</text>

  <rect class="external" x="574" y="242" width="238" height="96" rx="20"/>
  <text class="label" x="598" y="280">App-owned MCP</text>
  <text class="small" x="598" y="306">Trusted stdio or HTTP servers</text>

  <path class="line-blue" d="M506 263C546 263 544 150 570 150"/>
  <path class="line-blue" d="M693 202V238"/>

  <rect class="panel" x="850" y="34" width="322" height="552" rx="28"/>
  <text class="group" x="882" y="74">BROWSER / RENDERER</text>

  <rect class="accent" x="884" y="118" width="254" height="82" rx="16"/>
  <text class="label" x="906" y="151">Surface renderer API</text>
  <text class="small" x="906" y="176">Same contract for both adapters</text>

  <rect class="accent" x="884" y="242" width="254" height="82" rx="16"/>
  <text class="label" x="906" y="275">useCodexSurface</text>
  <text class="small" x="906" y="300">Reactive state · typed actions</text>

  <rect class="card" x="884" y="366" width="254" height="82" rx="16"/>
  <text class="label" x="906" y="399">Vue conversation kit</text>
  <text class="small" x="906" y="424">Sidebar · pane · components</text>

  <rect class="card" x="884" y="490" width="254" height="66" rx="16"/>
  <text class="label" x="906" y="520">Product UI</text>
  <text class="small" x="906" y="543">Shell · panels · business views</text>

  <path class="line" d="M256 425C650 425 650 159 880 159"/>
  <path class="line" d="M506 425C690 425 690 159 880 159"/>
  <path class="line" d="M1011 204V238"/>
  <path class="line" d="M1011 328V362"/>
  <path class="line" d="M1011 452V486"/>
</svg>
